<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f2">
    <title>My To-Do | A calmer day starts here</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="My To-Do home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m6.5 12.2 3.6 3.6 7.7-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>My To-Do</span>
        </a>
        <span class="header-note"><span class="status-dot" aria-hidden="true"></span> A little more in order</span>
      </header>

      <section class="todo-panel" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow">YOUR DAY, AT A GLANCE</p>
          <h1 id="page-title">Make room for<br><span>what matters.</span></h1>
          <p class="subtitle">Organize your day, one task at a time.</p>
        </div>

        <form class="task-form" id="task-form">
          <label class="visually-hidden" for="task-input">New task</label>
          <input id="task-input" name="task" type="text" placeholder="What needs to be done?" autocomplete="off" maxlength="200">
          <button class="add-button" type="submit">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
            <span>Add Task</span>
          </button>
        </form>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

        <div class="list-heading">
          <h2 id="list-title">Your tasks</h2>
          <span class="task-count" id="task-count" aria-live="polite">0 tasks left</span>
        </div>

        <ul class="task-list" id="task-list" aria-labelledby="list-title"></ul>
        <div class="empty-state" id="empty-state" aria-live="polite">
          <span class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none"><path d="M15 11.5h18a3 3 0 0 1 3 3v23H12v-23a3 3 0 0 1 3-3Z" /><path d="M19 11.5v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M18.5 22h11M18.5 28h11M18.5 34h6" /></svg>
          </span>
          <p class="empty-title">No tasks yet</p>
          <p class="empty-copy">Add a task above to get started.</p>
        </div>

        <footer class="task-controls" aria-label="Task controls">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button is-selected" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <div class="clear-actions">
            <button class="clear-button" id="clear-completed" type="button" disabled>Clear completed</button>
            <button class="clear-button clear-all-button" id="clear-all" type="button" disabled>Clear all</button>
          </div>
        </footer>
      </section>

      <p class="page-note">Small steps make a good day.</p>
    </main>
  </body>
</html>
